<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LaBubu 管理员密码生成器</title>
<style>
  :root{
    --crystal:#87CEFA; --accent:#B0E0E6; --bg:#F0F8FF; --deep:#4C9ED6; --text:#223344; --sub:#688298;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:"Microsoft YaHei UI","PingFang SC",sans-serif;
       background:linear-gradient(135deg,#F6FCFF 0%,#D6EEFC 55%,#BFE5F7 100%);color:var(--text);
       display:flex;align-items:center;justify-content:center;padding:24px}
  .card{width:100%;max-width:620px;background:#fff;border:1px solid #C4E4F8;border-radius:18px;
        padding:28px 28px 22px;box-shadow:0 18px 48px rgba(76,158,214,.18)}
  h1{margin:0 0 6px;font-size:22px;color:#266096;letter-spacing:.5px}
  .sub{margin:0 0 22px;font-size:13px;color:var(--sub)}
  label{display:block;font-size:13px;font-weight:700;margin:16px 0 8px}
  input{width:100%;padding:11px 13px;font-size:15px;border:1px solid #C4E4F8;border-radius:10px;
        background:#F8FCFF;color:var(--text);outline:none}
  input:focus{border-color:var(--crystal);box-shadow:0 0 0 3px rgba(135,206,250,.25)}
  button{margin-top:16px;width:100%;padding:12px;font-size:15px;font-weight:700;color:#fff;
         background:linear-gradient(135deg,#87CEFA,#4C9ED6);border:0;border-radius:10px;cursor:pointer}
  button:hover{filter:brightness(1.05)}
  .out{margin-top:18px;display:none}
  .out textarea{width:100%;height:130px;padding:12px;font-family:Consolas,monospace;font-size:12.5px;
        border:1px solid #C4E4F8;border-radius:10px;background:#F8FCFF;color:#1F4D74;resize:vertical}
  .hint{margin-top:10px;font-size:12.5px;color:var(--sub);line-height:1.7}
  .tag{display:inline-block;margin-bottom:14px;padding:4px 12px;border:1px solid var(--crystal);
       border-radius:14px;font-size:11.5px;font-weight:700;color:var(--deep);letter-spacing:1px;background:#EAF6FF}
  .copy{margin-top:10px;background:#fff;color:var(--deep);border:1px solid var(--crystal);font-weight:700}
</style>
</head>
<body>
<div class="card">
  <span class="tag">CRYSTAL EDITION</span>
  <h1>LaBubu 管理员密码生成器</h1>
  <p class="sub">输入新密码，得到可直接替换进仓库 admin.json 的配置。密码不会上传，全部在本机计算。</p>

  <label>新管理员密码</label>
  <input id="pwd" type="password" placeholder="例如 2513666">
  <label>新激活码（可留空，留空则沿用当前激活码）</label>
  <input id="code" type="password" placeholder="留空表示不修改激活码">

  <button id="gen">生成 admin.json</button>

  <div class="out" id="out">
    <label>把下面这一整段覆盖仓库里的 admin.json</label>
    <textarea id="json" readonly></textarea>
    <button class="copy" id="copy">复制</button>
    <div class="hint">
      保存后到 GitHub 仓库 → admin.json → 编辑 → 全选粘贴 → Commit changes，启动器下次启动会自动拉取新密码。<br>
      启动器读取的字段是 adminHash / activeHash（SHA-256，小写），不要改成别的名字。
    </div>
  </div>
</div>

<script>
async function sha256(s){
  const buf = new TextEncoder().encode(s);
  const h = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
document.getElementById('gen').onclick = async function(){
  const pwd = document.getElementById('pwd').value.trim();
  const code = document.getElementById('code').value.trim();
  if(!pwd){ alert('请先输入新的管理员密码。'); return; }
  if(!window.crypto || !crypto.subtle){ alert('当前页面不在 https 环境，无法计算哈希。请用 GitHub Pages 的 https 地址打开本页。'); return; }
  const adminHash = await sha256(pwd);
  const activeHash = code ? await sha256(code) : '（沿用原值，不要覆盖这一行）';
  const now = new Date().toLocaleString('zh-CN',{hour12:false});
  document.getElementById('json').value =
    '{\n  "adminHash": "' + adminHash + '",\n  "activeHash": "' + activeHash + '",\n  "updated": "' + now + '"\n}';
  document.getElementById('out').style.display = 'block';
};
document.getElementById('copy').onclick = function(){
  const t = document.getElementById('json');
  t.select(); document.execCommand('copy');
  this.textContent = '已复制';
  setTimeout(()=>this.textContent='复制', 1500);
};
</script>
</body>
</html>
